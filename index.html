<style>
  @font-face { font-family: Questrial; src: url(/fonts/questrial-latin.woff2) format('woff2'); font-display: swap; }
  /* Paper everywhere: Safari fills the strip behind the status bar and the area behind its toolbar from the page's
     background, so html, body and the art all sit on exactly this colour, edge to edge */
  :root { color-scheme: light; --paper: #F9F5EC; --ink: #8C6A58; --name: #33281F; --line: #625548; }
  html { background: var(--paper); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); height: 100vh; height: 100svh; -webkit-tap-highlight-color: transparent; }
  /* the art is fixed to the whole screen, under the status bar and the toolbars too; it never scrolls */
  #art { position: fixed; left: 0; top: 0; width: 100%; height: 100vh; height: 100lvh; overflow: hidden; background: var(--paper);
    transition: opacity .7s ease-in-out; }
  body.leaving #art { opacity: 0; }
  #art img { position: absolute; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  #art .layer { visibility: hidden; }
  #art.ready .layer { visibility: visible; }
  #fig { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
  #fig img, #fig svg, #fig canvas { position: absolute; }
  /* the moving body and its ghosts: ink laid over the drawing (multiply), so the land shows through like a wash */
  #bodycv { position: absolute; display: none; mix-blend-mode: multiply; pointer-events: none; }
  #rvcv { display: none; }
  body.anim #hero, body.anim #shadow { opacity: 0; }
  /* after the cartwheel, the clouds drift a few pixels over a long cycle */
  @keyframes drift { from { translate: 0 0; } to { translate: var(--dx) 0; } }
  body.drift #bankL { --dx: 9px; animation: drift 47s ease-in-out infinite alternate; }
  body.drift #bankR { --dx: -7px; animation: drift 61s ease-in-out infinite alternate; }
  body.drift #small { --dx: 6px; animation: drift 39s ease-in-out infinite alternate; }
  @media (prefers-reduced-motion: reduce) { body.drift #bankL, body.drift #bankR, body.drift #small { animation: none; } }
  #name { position: absolute; pointer-events: none; overflow: visible; }
  #line { position: absolute; left: 0; right: 0; margin: 0; text-align: center; font-family: Questrial, system-ui, sans-serif;
    font-size: 15.5px; letter-spacing: .03em; color: var(--line); white-space: nowrap; }
  #links { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 0 28px; }
  #links a { font-family: Questrial, system-ui, sans-serif; font-size: 16px; letter-spacing: .08em; color: var(--name);
    text-decoration: none; padding: 10px 2px; transition: opacity .25s ease; }
  #links a:hover, #links a:focus-visible { opacity: .6; }
  #links a:focus { outline: none; }
  #links a:focus-visible { outline: 1.5px solid rgba(51, 40, 31, .5); outline-offset: 2px; border-radius: 3px; }
  body[data-comp="desktop"] #line { font-size: 17px; }
  body[data-comp="desktop"] #links a { font-size: 17px; }
  .probe { position: fixed; left: 0; top: 0; width: 0; visibility: hidden; pointer-events: none; }
  #p-s { height: 100vh; height: 100svh; } #p-l { height: 100vh; height: 100lvh; }
  #p-i { height: 0; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { #art { transition: none; } }

<script>
// The layout: one ink drawing laid out live for any screen. Everything is measured in the drawing's own units (the
// phone design is 900 units wide): u is CSS px per unit. The land is one wide strip (more desert either side of the
// phone's view) so it always runs edge to edge; the cloud banks are anchored to the screen's sides so they come in
// off the edges; the name sits at about 35% of the screen.
window.ART = {"land": {"box": [-2400, 0, 5000, 1000], "ref": "land"}, "bankL": {"box": [-134, 240, 463, 198], "ref": "topleft"}, "bankR": {"box": [596, 835, 409, 210], "ref": "right"}, "small": {"box": [35, -37, 190, 75], "ref": "land"}, "sun": {"box": [641, 840, 142, 142], "ref": "right"}, "tiles": [[-2400, -200], [-200, 1000], [1000, 2600]], "hero": {"x": 396, "y": 538, "w": 490, "h": 622}};
(function () {
  var A = window.ART, art = document.getElementById('art'), $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search), dbgSafe = q.get('safe');
  var dir = '/art/';
  var LINKY = 174, NAMEY = 683, GROUND = 587, FIGX = 622;
  function px(el, x, y, w, h) { el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px'; }
  var sigBox = null;
  function layout() {
    var W = art.clientWidth, Hl = $('p-l').offsetHeight || innerHeight, Hs = $('p-s').offsetHeight || innerHeight;
    var cs = getComputedStyle($('p-i')), safeT = parseFloat(cs.paddingTop) || 0, safeB = parseFloat(cs.paddingBottom) || 0;
    if (dbgSafe) { var s = dbgSafe.split(','); safeT = +s[0]; safeB = +s[1]; }
    var phone = W / Hs < 0.8;
    document.body.dataset.comp = phone ? 'phone' : 'desktop';
    var u, uS, xo, groundY, nameY, nameW, linksTop;
    if (phone) {
      // the phone design is 900 × 1950: a wider portrait screen (an iPad) keeps its proportions and gets more desert at the sides
      u = Math.min(W / 900, Hs / 1950); uS = Math.min(W / 900, u * 1.3); xo = (W - 900 * u) / 2;
      groundY = Hs - Math.max(46, safeB + 54);
      nameY = Hs * 0.35; nameW = Math.min(W * 0.76, 684 * u * 1.25); linksTop = safeT + 17;
    } else {
      u = Math.min(Hs / 900, W / 1440) * 0.62;
      // the cloud banks are sized to the screen, so they still frame the name on a wide one
      uS = Math.min(W * 0.27 / 463, Hs * 0.2 / 198);
      xo = W * 0.62 - FIGX * u;
      groundY = Hs - Math.max(40, Hs * 0.08);
      nameY = Hs * 0.33; nameW = Math.max(340, Math.min(820, W * 0.34, Hs * 0.62)); linksTop = safeT + 26;
    }
    var landTop = groundY - GROUND * u;
    // land tiles: only the ones on screen load
    A.tiles.forEach(function (t, i) {
      var el = $('land' + i), x = xo + t[0] * u, w = (t[1] - t[0]) * u;
      px(el, x, landTop, w, A.land.box[3] * u);
      var on = x + w > 0 && x < W;
      if (on && !el.getAttribute('src')) el.src = dir + 'land' + i + '.webp';
      el.style.display = on ? '' : 'none';
    });
    // sky: bankL from the top-left, bankR and the sun from the right edge and the name, the small cloud over the mesa
    var b = A.bankL.box; px($('bankL'), b[0] * uS, linksTop + (b[1] - LINKY) * uS, b[2] * uS, b[3] * uS);
    // bankR and the sun: off the right edge, below the line; on a wide screen kept clear of the mesas
    var rb = A.bankR.box, dyR = 0, horizonY = landTop + 216 * u;
    if (!phone) dyR = Math.min(0, (horizonY - 70 * u / 0.62) - (nameY + (rb[1] + rb[3] - NAMEY) * uS));
    ['bankR', 'sun'].forEach(function (k) { var b = A[k].box; px($(k), W - (900 - b[0]) * uS, nameY + (b[1] - NAMEY) * uS + dyR, b[2] * uS, b[3] * uS); });
    b = A.small.box; px($('small'), xo + b[0] * u, landTop + b[1] * u, b[2] * u, b[3] * u);
    // the figure: drawn in the old print's sheet units, shown at 0.9 about its ground point
    var f = $('fig'), k = 0.9 * u;
    f.style.transform = 'translate(' + (xo + (452 - 452 * 0.9) * u) + 'px,' + (landTop + (GROUND - 1150 * 0.9) * u) + 'px) scale(' + k + ')';
    var H = A.hero; px($('hero'), H.x, H.y, H.w, H.h);
    px($('shadow'), 770 - 110, 1152 - 12, 220, 24);
    // the name: the signature paths, a touch heavier, centred on nameY
    var nm = $('name'), use = nm.querySelector('use');
    if (!sigBox) { sigBox = use.getBBox(); }
    var sc = nameW / sigBox.width, nh = sigBox.height * sc;
    px(nm, (W - nameW) / 2, nameY - nh / 2, nameW, nh);
    nm.setAttribute('viewBox', sigBox.x + ' ' + sigBox.y + ' ' + sigBox.width + ' ' + sigBox.height);
    document.getElementById('signature').setAttribute('stroke-width', (phone ? 1.9 : 2.2) / sc);
    if (!phone) { var fs = Math.max(15.5, Math.min(22, nameW * 0.033)); $('line').style.fontSize = fs + 'px'; Array.prototype.forEach.call(document.querySelectorAll('#links a'), function (a) { a.style.fontSize = Math.max(16, Math.min(19, fs * 1.02)) + 'px'; }); }
    $('line').style.top = (nameY + nh / 2 + (phone ? 10 : 14)) + 'px';
    $('links').style.top = linksTop + 'px';
    var fk = 0.9 * u, ftx = xo + (452 - 452 * 0.9) * u, fty = landTop + (GROUND - 1150 * 0.9) * u;
    window.LAYOUT = { W: W, Hs: Hs, Hl: Hl, u: u, uS: uS, xo: xo, landTop: landTop, groundY: groundY, nameY: nameY, phone: phone, fk: fk, ftx: ftx, fty: fty };
    var rv = $('rvcv'); px(rv, H.x, H.y, H.w, H.h);
    if (window.ANIM_LAYOUT) window.ANIM_LAYOUT();
  }
  ['bankL', 'bankR', 'small', 'sun'].forEach(function (k) { $(k).src = dir + k + '.webp'; });
  $('hero').src = dir + 'hero.webp';
  layout();
  var raf = 0;
  addEventListener('resize', function () { if (!raf) raf = requestAnimationFrame(function () { raf = 0; layout(); }); });
  // show it all at once, once the visible layers have loaded (never bare paper with pieces popping in)
  var imgs = Array.prototype.slice.call(art.querySelectorAll('img')).filter(function (im) { return im.getAttribute('src') && im.style.display !== 'none'; });
  window.SHOWN = Promise.all(imgs.map(function (im) { return im.decode().catch(function () {}); })).then(function () { art.classList.add('ready'); window.READY = true; });

  // following a link: the page dissolves to paper, then goes (which also gives GoatCounter time to count the click)
  document.getElementById('links').addEventListener('click', function (e) {
    var a = e.target.closest('a'); if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    e.preventDefault();
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: 'click-' + a.id, title: a.textContent.trim(), event: true });
    document.body.classList.add('leaving');
    setTimeout(function () { location.href = a.href; }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 700);
  });
  // coming back with the browser's back button shows the page again
  addEventListener('pageshow', function (e) { if (e.persisted) document.body.classList.remove('leaving'); });
})();

<script>
// ---------------------------------------------------------------------------
// The cartwheel. The page opens on the finished drawing without the figure; then his body cartwheels across the
// plain as a soft ink silhouette with a short trail (the clip's 38 poses with 3 in-betweens each, as vector shapes,
// 1.7 times slower than life), leaving a pale ghost at three poses; the ghosts drift back along the ground into their
// places, as if the paper moved under them, and fade as he lands; then the colour is sketched in, hatching first,
// from the hands up. Then only the clouds drift. The last frame is the still. Reduced motion shows the still.
// ---------------------------------------------------------------------------
(function () {
  var q = new URLSearchParams(location.search), $ = function (id) { return document.getElementById(id); };
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches || q.get('still') === '1';
  var body = document.body;
  function finish() { $('shadow').style.opacity = ''; body.classList.remove('anim'); $('bodycv').style.display = 'none'; $('rvcv').style.display = 'none'; body.classList.add('drift'); window.ANIM_DONE = true; }
  if (REDUCED) { window.SHOWN.then(finish); return; }
  body.classList.add('anim');
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var smooth = function (u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };

  // ---- timing (seconds from the start) ----
  var M = { lead: 0.7, slow: 1.7, first: 8, last: 45, rampIn: 4, keys: [12, 25, 34], inkIn: 0.35, settle: 0.35, easeFrom: 38, easeBy: 1.3 };
  var TF = {}, t = M.lead;
  for (var f = M.first; f <= M.last + 1; f++) { TF[f] = t; t += M.slow / 30 * (1 + M.easeBy * smooth((f - M.easeFrom) / (M.last - M.easeFrom))); }
  var tf = function (f) { return TF[clamp(f, M.first, M.last + 1)]; };
  var frameAt = function (t) { var f = M.first; while (f < M.last && TF[f + 1] <= t) f++; return f; };
  var t45 = tf(M.last), plateEnd = t45 + M.settle, tk = M.keys.map(tf);
  var ramp = function (f) { return f < M.first + M.rampIn ? (f - M.first + 1) / (M.rampIn + 1) : 1; };
  var TRAIL = [[0, 1]]; for (var j = 1; j <= 16; j++) TRAIL.push([j * 0.01, 0.5 * Math.exp(-j * 0.01 / 0.055)]);
  var RV = { t0: t45 + 0.1, D: 1.9, soft: 0.03 }, rvEnd = RV.t0 + RV.D * (1 + RV.soft) + 0.05;
  var gOutAt = plateEnd + 0.1, gOutDur = Math.max(0.6, RV.t0 + RV.D - gOutAt + 0.25);
  var END = Math.max(rvEnd, gOutAt + gOutDur);

  var B = null, paths = [], D = null;
  var INK = [0x8C, 0x6A, 0x58], PAPER = [0xF9, 0xF5, 0xEC];

  var mulColor = function (k) { return 'rgb(' + [0, 1, 2].map(function (c) { return Math.round(255 * (1 - k * (1 - INK[c] / PAPER[c]))); }).join(',') + ')'; };

    i = clamp(Math.round(i), 0, B.frames.length - 1);
    if (paths[i]) return paths[i];
    var p = new Path2D();
    B.frames[i].split(';').forEach(function (ring) {
      var v = ring.split(','), x = 0, y = 0;
      for (var n = 0; n < v.length; n += 2) { x += +v[n]; y += +v[n + 1]; if (n === 0) p.moveTo(x / 2, y / 2); else p.lineTo(x / 2, y / 2); }

    var knots = [[tk[0], 0], [tk[1], D[0] - D[1]], [tk[2], D[0] - D[2]]];
    if (t <= knots[0][0]) return 0;
    for (var i = 0; i < 2; i++) if (t <= knots[i + 1][0]) return knots[i][1] + (knots[i + 1][1] - knots[i][1]) * (t - knots[i][0]) / (knots[i + 1][0] - knots[i][0]);

  var X0 = -10, X1 = 900, Y0 = 500, Y1 = 1175, bcv = $('bodycv'), bx = bcv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1), BS = 1;

    bcv.style.width = ((X1 - X0) * BS) + 'px'; bcv.style.height = ((Y1 - Y0) * BS) + 'px';

      var op = smooth((t - tk[i]) / M.inkIn) * (1 - smooth((t - gOutAt) / gOutDur));
      if (op < 0.01) continue;
      bx.save(); bx.translate((D[0] - P) - D[i], 0); bx.fillStyle = mulColor(0.11 * op); bx.fill(pathOf((M.keys[i] - M.first) * B.K)); bx.restore();
    }
    // the body and its trail
    if (t >= M.lead) for (var j = TRAIL.length - 1; j >= 0; j--) {
      var ts = t - TRAIL[j][0]; if (ts < M.lead) continue;
      var a = TRAIL[j][1] * ramp(frameAt(ts));
      if (j === 0 && t >= t45) a *= 1 - smooth((t - t45) / 0.1);
      if (j > 0 && t > t45) a *= Math.exp(-(t - t45) / 0.08);
      if (a < 0.01) continue;
      bx.fillStyle = mulColor(0.5 * a); bx.fill(pathOf(posAt(ts)));
    }
  }

  // ---- the colour, sketched in from the hands up: per-pixel times worked out once from the figure itself ----
  var R = null, rcv = $('rvcv'), rx = rcv.getContext('2d', { willReadFrequently: true });
  function prepReveal(heroIm) {
    var w = rcv.width, h = rcv.height; rx.clearRect(0, 0, w, h); rx.drawImage(heroIm, 0, 0, w, h);
    var src = rx.getImageData(0, 0, w, h).data; rx.clearRect(0, 0, w, h);
    var idx = [], ymin = 1e9, ymax = -1e9;
    for (var i = 0; i < w * h; i++) if (src[i * 4 + 3] > 5) { idx.push(i); var y = (i / w) | 0; if (y < ymin) ymin = y; if (y > ymax) ymax = y; }
    // smooth value noise
    var hash = function (x, y) { var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return (n - Math.floor(n)) * 2 - 1; };
    var vnoise = function (x, y) { var xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
      var a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy; };
    var ang = 58 * Math.PI / 180, ca = Math.cos(ang), sa = Math.sin(ang), n = idx.length;
    var C = new Float32Array(n), K = new Float32Array(n), S = new Float32Array(n), HA = new Float32Array(n);
    for (var m = 0; m < n; m++) {
      var i2 = idx[m], x = i2 % w, y2 = (i2 / w) | 0, p = i2 * 4, A = src[p + 3] / 255;
      var front = (ymax - y2) / (ymax - ymin), along = ((x * ca + y2 * sa) / 34) % 1;
      var s = clamp(0.62 * front + 0.07 * along + 0.04 * vnoise(x / 9, y2 / 9), 0, 0.75);
      S[m] = s; C[m] = clamp(s + 0.2 + 0.05 * vnoise(x / 6 + 40, y2 / 6), 0, 1);
      var lum = (0.3 * src[p] + 0.59 * src[p + 1] + 0.11 * src[p + 2]) / 255;
      K[m] = lum < 0.28 && A > 0.5 ? s + 0.01 : 2;
      var vv = (-x * sa + y2 * ca) / 6.5, line = Math.abs(vv - Math.round(vv)) * 6.5;
      HA[m] = clamp(1.4 - line, 0, 1) * A * 0.9;
    }
    var out = rx.createImageData(w, h);
    R = { idx: idx, C: C, K: K, S: S, HA: HA, src: src, out: out };
  }
  function drawReveal(t) {
    var sil0 = smooth((t - t45) / 0.1), rt = (t - RV.t0) / RV.D, soft = RV.soft, od = R.out.data, src = R.src;
    for (var m = 0, n = R.idx.length; m < n; m++) {
      var p = R.idx[m] * 4, A = src[p + 3] / 255;
      var fc = smooth((rt - R.C[m]) / soft), fk = R.K[m] < 2 ? smooth((rt - R.K[m]) / 0.02) : 0, v = fc > fk ? fc : fk;
      var fs = smooth((rt - R.S[m]) / 0.02);
      var r = INK[0], g = INK[1], b = INK[2], al = A * 0.5 * (1 - fs) * sil0, a2, ao;
      a2 = R.HA[m] * fs * (1 - v);
      if (a2 > 0) { ao = a2 + al * (1 - a2); r = (0x6E * a2 + r * al * (1 - a2)) / ao; g = (0x52 * a2 + g * al * (1 - a2)) / ao; b = (0x44 * a2 + b * al * (1 - a2)) / ao; al = ao; }
      a2 = A * v;
      if (a2 > 0) { ao = a2 + al * (1 - a2); r = (src[p] * a2 + r * al * (1 - a2)) / ao; g = (src[p + 1] * a2 + g * al * (1 - a2)) / ao; b = (src[p + 2] * a2 + b * al * (1 - a2)) / ao; al = ao; }
      od[p] = r; od[p + 1] = g; od[p + 2] = b; od[p + 3] = al * 255;
    }
    rx.putImageData(R.out, 0, 0);
  }

  var lastT = -1, sh = $('shadow');
  function draw(t) {
    lastT = t;
    if (t >= END) { finish(); return; }
    drawBody(t);
    if (t >= t45) drawReveal(t);
    sh.style.opacity = smooth((t - t45 - 0.14) / 0.6);
  }
  window.ANIM = { end: END, seek: function (t) { if (B && R) { if (t >= END) { finish(); } else { body.classList.add('anim'); body.classList.remove('drift'); bcv.style.display = 'block'; rcv.style.display = 'block'; draw(t); } } } };

  // ---- go: once the land is up and the figure's pieces are in. If they come more than 5 s after the land, open
  // on the still instead of starting late ----
  var heroIm = $('hero');
  var shownAt = 0; window.SHOWN.then(function () { shownAt = performance.now(); });
  var need = Promise.all([fetch('/art/body.json').then(function (r) { return r.json(); }), heroIm.decode()]);
  Promise.all([window.SHOWN, need]).then(function (res) {
    B = res[1][0]; D = B.D; prepReveal(heroIm);
    if (performance.now() - shownAt > 5000) { finish(); return; }
    bcv.style.display = 'block'; rcv.style.display = 'block'; window.ANIM_LAYOUT();
    window.ANIM_READY = true;
    if (q.get('pause') === '1') { draw(0); return; }
    var t0 = 0;
    var frame = function (now) {
      if (!t0) t0 = now;
      var t = (now - t0) / 1000; draw(t);
      if (t < END) requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }).catch(function () { finish(); });
})();
</script>
