<script>
// The landing animation: the finished print is there from the first frame, all but the cartwheel; then the cartwheel
// happens, and the clouds drift a few pixels over a long cycle. Built from the layers mock/anim.py renders, stacked
// in the page: nothing is drawn live but the ink of an impression as it takes.
//
// Two versions:
//   'motion'       the body moves. It runs through every frame of the clip from the reach to the straddle (a
//                  flipbook, with a short trail like a long exposure), and each of the three key poses it passes
//                  stays behind as a ghost. It lands in the straddle, where the full-colour print takes over the
//                  silhouette and the contact shadow comes up with the weight. Needs anim.py --movers.
//   'plate'        the body moves exactly as in the clip (anim.py --plate: its true path, hands and feet planted),
//                  ending on the straddle; each ghost is printed where the body was and then drifts back along
//                  the ground into its place in the still, as if the paper under it moved (a moving-plate
//                  chronophotograph). A canvas over the ground redraws the land with each ghost's ink (multiply
//                  and add layers) at its offset; when they arrive it hands over to the exact ghost layers.
//   'impressions'  the first prototype: the ghosts print in place one after another, then the straddle.
//
//   const p = PrintPlayer.mount(host, manifest, { dir, mode, reveal: 'blocks' | 'develop' | 'ink', straddle, text,
//                                                 reduced, finished, driftSpeed, drift, slow, trail, onShow, onReady, autoplay })
// `straddle` picks how the blocks arrive (MOTION.straddles: 'now', 'eased', 'lift', 'slow'); `drift` is how far
// the clouds travel (DRIFTS: 'now', 'x15', 'x2', 'x25'); `text` a link treatment the manifest has a layer for.
// The land and clouds show as soon as they have loaded (onShow); the cartwheel starts once everything has (onReady).
// `finished` (or `reduced`) opens on the finished print: no cartwheel, and the drift only if not reduced.
//   p.replay(); p.setText(style); p.setDriftSpeed(k); p.setDrift(name); p.destroy();
//
// `host` is sized by the caller to the sheet's aspect ratio; everything inside is positioned in % of the sheet.
window.PrintPlayer = (function () {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
  const easeOut = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 2.4);

  // 'impressions': the four poses are clip frames 12, 25, 34 and 45 (30 fps), played 2.6 times slower. Each ghost
  // takes 0.8 s to print, the straddle 0.85 s; its shadow comes up just after it. Done by about 4.5 s.
  const TIMING = { lead: 0.6, slow: 2.6, frames: [12, 25, 34, 45], ghost: 0.8, hero: 0.85, shadowLag: 0.22, shadow: 0.9 };
  // 'motion': the clip's frames 8–45 at `slow` times real time (1.7: a frame every 57 ms, the whole cartwheel in
  // 2.1 s). The body inks in over its first four frames; each earlier frame lingers at `trail` of full strength and
  // fades with a time constant of `trailFade` s. A key pose becomes its ghost as the body leaves it (`ghostFade` s).
  // On the straddle the colour print takes over (`hero` s), the shadow comes up, and the silhouette under the
  // print fades away.
  const MOTION = { lead: 0.7, slow: 1.7, first: 8, last: 45, rampIn: 4, keys: [12, 25, 34], trail: 0.5, trailFade: 0.075,

        const o = smooth((t - I.t) / M.inkIn), off = I.D - (P - (inks[0].D - I.D));
        const x = I.g.m.x + off - PR.x, y = I.g.m.y - PR.y;
        cx.globalAlpha = o; cx.globalCompositeOperation = 'multiply'; cx.drawImage(I.m, x, y);
        cx.globalCompositeOperation = 'lighter'; cx.drawImage(I.a, x, y);
      }
      cx.globalCompositeOperation = 'source-over'; cx.globalAlpha = 1;
    }

    let t0 = 0, raf = 0, ready = false, dead = false, drifting = false;
    function frame(now) {
      raf = 0; if (dead) return;
      const t = (now - t0) / 1000;
      for (const k in patches) { const P = patches[k]; setPatch(P, clamp((t - P.e.at) / P.e.dur, 0, 1)); }
      for (const B of bodies) setBody(B, bodyOpacity(B.f, t));
      if (plateCv) drawPlate(t);
      if (!drifting && t >= end) { drifting = true; driftCSS(!reduced); }
      if (t < end + 0.05) raf = requestAnimationFrame(frame);
    }
    function start(done = reduced || !!opt.finished) {
      if (dead) return;
      drifting = false; driftCSS(false);
      for (const k in patches) { const P = patches[k]; P.p = -1; setPatch(P, done ? 1 : 0); }
      for (const B of bodies) { B.o = -1; setBody(B, 0); }
      if (plateCv) { plateShown = false; plateCv.style.visibility = 'hidden'; }
      if (done) { drifting = true; driftCSS(!reduced); return; }
      // measure from the next frame, so the body starts after the land has been on screen for `lead`
      requestAnimationFrame((now) => { t0 = now; if (!raf) raf = requestAnimationFrame(frame); });
    }

    const settle = (im) => im.decode().catch(() => new Promise((r) => { if (im.complete) r(); else { im.onload = im.onerror = r; } }));
    const first = [base, ...clouds.map((c) => c.im), ...Object.values(texts)];
    const rest = [...Object.values(patches).map((P) => P.im), ...bodies.map((B) => B.im), ...inks.map((I) => I.m), ...inks.map((I) => I.a), ...inkClouds.map((I) => I.m), ...inkClouds.map((I) => I.a)];
    const shown = Promise.all(first.map(settle)).then(() => { if (dead) return; sheet.style.visibility = 'visible'; if (opt.onShow) opt.onShow(); });
    Promise.all([shown, ...rest.map(settle)]).then(() => {
      if (dead) return;
      for (const k in patches) if (patches[k].e.kind === 'ink') { const P = patches[k]; try { prepInk(P); } catch (e) { P.e.kind = 'fade'; P.el.getContext('2d').drawImage(P.im, 0, 0); P.el.style.opacity = '0'; } }
      for (const el of late) el.style.visibility = '';
      ready = true;
      if (opt.onReady) opt.onReady();
      if (opt.autoplay !== false) start();
    });

    return {
      get ready() { return ready; },
      end, mode,
      replay() { if (!ready) return; if (raf) { cancelAnimationFrame(raf); raf = 0; } start(); },
      start() { if (ready) start(); },
      setText(s) { textStyle = s; for (const k in texts) texts[k].style.visibility = k === s ? 'visible' : 'hidden'; },
      setDriftSpeed(k) { driftSpeed = k; if (drifting) driftCSS(!reduced); },
      setDrift(name) { driftK = DRIFTS[name] || (typeof name === 'number' ? name : 1); if (drifting) driftCSS(!reduced); },
      setTrail(on) { trailOn = on; },
      destroy() { dead = true; if (raf) cancelAnimationFrame(raf); if (dTimer) clearTimeout(dTimer); sheet.remove(); },
    };
  }
  return { mount, TIMING, MOTION, DRIFT, DRIFTS };
})();

</script>
<script>
// ---------------------------------------------------------------------------
// The landing: the print is on screen from the first moment, all but the cartwheel; the body then cartwheels
// across the plain, leaving its three ghosts behind, and lands in the straddle; then the clouds drift. Clicking
// the drawing does nothing. With reduced motion the finished print shows, still.
// ---------------------------------------------------------------------------
(function () {
  var P = window.PRINT, REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage'), sheet = document.getElementById('sheet'), host = document.getElementById('print');
  var links = document.getElementById('links'), dot = links.querySelector('.dot'), offer = document.getElementById('offer'), writing = document.getElementById('writing');
  var comp = null, set = null, player = null, played = false;
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  // Which part of the sheet the screen shows. Phone: its full width, from the top; a shorter screen loses ground
  // at the bottom. Desktop: as much as fills the screen, keeping the name, links, sun and cartwheel (C.safe) in
  // view; a screen too wide or too narrow for that shows paper beside or above the print.
  function view() {
    var C = P.comps[comp], vw = stage.clientWidth, vh = stage.clientHeight, A = vw / Math.max(1, vh), u, x0, y0;
    if (comp === 'phone') { u = vw / C.W; x0 = 0; y0 = 0; }
    else {
      var s = C.safe, w = Math.min(C.W, C.H * A), h = w / A;
      if (w < s[2] - s[0]) { w = s[2] - s[0]; h = w / A; }
      if (h < s[3] - s[1]) { h = s[3] - s[1]; w = h * A; }
      u = vw / w;
      x0 = w >= C.W ? (C.W - w) / 2 : clamp((s[0] + s[2]) / 2 - w / 2, 0, C.W - w);
      y0 = h >= C.H ? (C.H - h) / 2 : clamp((s[1] + s[3]) / 2 - h / 2, 0, C.H - h);
    }
    return { u: u, x0: x0, y0: y0 };
  }
  function pickSet(u) {
    var C = P.comps[comp], need = u * (window.devicePixelRatio || 1);
    for (var i = 0; i < C.sets.length; i++) if (P.sets[C.sets[i]].ss >= need * 0.85) return C.sets[i];
    return C.sets[C.sets.length - 1];
  }
  function layout() {
    var C = P.comps[comp], v = view();
    sheet.style.width = C.W + 'px'; sheet.style.height = C.H + 'px';
    sheet.style.transform = 'translate(' + (-v.x0 * v.u) + 'px,' + (-v.y0 * v.u) + 'px) scale(' + v.u + ')';
    document.documentElement.style.setProperty('--u', '1px');
    // the links are in sheet px too; the desktop's second link sits after the first, measured once the font is in
    if (comp === 'desktop') placeDesktopLinks();
    return v;
  }
  function placeDesktopLinks() {
    var w = offer.getBoundingClientRect().width / (sheet.getBoundingClientRect().width / P.comps.desktop.W || 1);
    links.style.setProperty('--dot-x', (88 + w + 18) + 'px'); links.style.setProperty('--writing-x', (88 + w + 18 + 3.2 + 18) + 'px');
  }
  // The land shows as soon as it has loaded; the cartwheel starts once its own layers have. If they take more than
  // five seconds longer (a slow connection), the page opens on the finished print instead of starting it late.
  var LATE = 5000;
  function mount(finished) {
    if (player) { player.destroy(); player = null; }
    var S = P.sets[set], shownAt = 0;
    host.style.backgroundImage = 'url(' + P.comps[comp].lqip + ')';
    var p = player = PrintPlayer.mount(host, S, { dir: '/print/' + set + '/', mode: P.mode || 'motion', reveal: P.reveal || 'ink', straddle: P.straddle, drift: P.drift, slow: P.slow, trail: true, text: null,
      reduced: REDUCED, finished: finished, autoplay: false,
      onShow: function () { shownAt = performance.now(); },
      onReady: function () {
        if (p !== player) return;
        var late = !finished && shownAt && performance.now() - shownAt > LATE;
        played = true; window.__printReady = true;
        if (late) { player.destroy(); player = PrintPlayer.mount(host, S, { dir: '/print/' + set + '/', mode: P.mode || 'motion', drift: P.drift, text: null, reduced: REDUCED, finished: true }); }
        else p.start();
      } });
  }
  function choose() {
    var c = window.innerWidth / Math.max(1, window.innerHeight) < 0.8 ? 'phone' : 'desktop';
    var changed = c !== comp; comp = c; document.body.dataset.comp = comp;
    var v = layout(), s = pickSet(v.u);
    if (changed || (P.sets[s].ss > P.sets[set].ss)) { set = s; mount(played); }       // never replays: a rotation opens on the finished print
  }
  comp = P.first.comp; set = P.first.set; document.body.dataset.comp = comp;
  layout(); mount(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (comp === 'desktop') placeDesktopLinks(); });
  var rt = 0;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(choose, 120); });
  window.addEventListener('orientationchange', function () { setTimeout(choose, 200); });

  // leaving: the page's own dissolve over the sheet (0.7 s) before navigating, so you leave on bare paper
  Array.prototype.forEach.call(links.querySelectorAll('a'), function (a) {
    a.addEventListener('click', function (e) {
      if (REDUCED || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (document.body.classList.contains('leaving')) { e.preventDefault(); return; }
      e.preventDefault();
      document.body.classList.add('leaving');
      setTimeout(function () { window.location.href = a.href; }, 700);
    });
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) document.body.classList.remove('leaving'); });
})();
</script>
<script>
(function(){
  // Count clicks on the two links; no-op if count.js is blocked or hasn't loaded.
  // The page's 0.7 s dissolve before navigating gives the beacon time to send.
  var links = document.getElementById("links");
  if (!links) return;
  links.addEventListener("click", function(e){
    var a = e.target && e.target.closest ? e.target.closest("a") : null;
    if (!a || !(window.goatcounter && window.goatcounter.count)) return;
    window.goatcounter.count({ path: "click-" + a.id, title: a.textContent.trim(), event: true });
  }, true);
})();
</script>
<script data-goatcounter="https://tannerholman.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
