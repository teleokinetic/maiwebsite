<style>
    :root { color-scheme: light; --k: 1; --stage-right: 0px; }
    html { height: 100%; background: #eef0ec; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: #eef0ec; color: #262e38; overflow: hidden; position: relative; width: 100%;
      height: 100vh; height: 100dvh; height: 100svh; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #frame { position: absolute; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); pointer-events: none; }
    #sheet { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    #stage { position: absolute; inset: 0; isolation: isolate; background: #eef0ec; cursor: pointer; overflow: hidden; }
    #stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
    /* the sheet's edges feather into the surrounding paper, so the drawing sits on the page rather than in a frame;
       the feather is measured in the design's own units (44 of 1440 across, 60 of 900 on the phone) and never
       reaches the name, the ensō or the figure */
    #stage::after { content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none;
      --feather: calc(44px * var(--k));
      background:
        linear-gradient(to right,  #eef0ec 0, rgba(238,240,236,.55) calc(var(--feather) * .4), rgba(238,240,236,0) var(--feather),
                                   rgba(238,240,236,0) calc(100% - var(--feather)), rgba(238,240,236,.55) calc(100% - var(--feather) * .4), #eef0ec 100%),
        linear-gradient(to bottom, #eef0ec 0, rgba(238,240,236,.55) calc(var(--feather) * .4), rgba(238,240,236,0) var(--feather),
                                   rgba(238,240,236,0) calc(100% - var(--feather)), rgba(238,240,236,.55) calc(100% - var(--feather) * .4), #eef0ec 100%); }
    body[data-comp="phone"] #stage::after { --feather: calc(26px * var(--k)); }
    #enso, #figure, #name { pointer-events: none; }
    #enso { z-index: 1; mix-blend-mode: multiply; } #figure { z-index: 2; } #name { z-index: 3; mix-blend-mode: multiply; }
    /* the sheet and the links dissolve together when a link is followed */
    #stage, #links a { transition: opacity .6s ease; }
    body.leaving #stage { opacity: 0; transition: opacity .7s ease-in-out; }
    body.leaving #links a { opacity: 0; transition: opacity .7s ease-in-out 0s; }

    /* ---- the links: EB Garamond small caps, in the design's own coordinate space (scaled by --k) ---- */
    #links a { font-family: 'EB Garamond', Garamond, 'Times New Roman', serif; font-weight: 500; font-variant-caps: small-caps; letter-spacing: .06em;
      color: #45586c; text-decoration: none; white-space: nowrap; position: relative; opacity: 0; visibility: hidden;
      transition: color .3s ease, opacity .6s ease, visibility 0s linear .6s; }
    #links.show a { opacity: 1; visibility: visible; transition: color .3s ease, opacity .6s ease, visibility 0s; }
    #links a:focus { outline: none; }
    #links a::after { content: ""; position: absolute; left: 0; right: 0; height: 1px; }

    /* desktop: one line under the handwritten name; the hairline draws in on hover */
    #links { position: absolute; z-index: 10; left: calc(88px * var(--k)); top: calc(126px * var(--k)); display: flex; flex-direction: row; align-items: center; gap: calc(18px * var(--k)); }
    #links a { display: inline-flex; align-items: center; padding: calc(6px * var(--k)) 0; font-size: calc(18px * var(--k)); line-height: calc(22px * var(--k)); }
    #links .dot { display: block; width: calc(3px * var(--k)); height: calc(3px * var(--k)); border-radius: 50%; background: #45586c; opacity: .6; }
    #links a::after { bottom: calc(3px * var(--k)); background: #262e38; opacity: .7; transform: scaleX(0); transform-origin: left center; transition: transform .32s cubic-bezier(.2, .7, .2, 1); }
    #links a:hover, #links a:focus-visible { color: #262e38; }
    #links a:hover::after, #links a:focus-visible::after { transform: scaleX(1); }
    #links a:active { color: #141a22; }
    #links a:active::after { opacity: 1; }

    /* phone: the offer under the name, the Substack line alone at the bottom-right, above the browser's toolbar */
    body[data-comp="phone"] #links { display: contents; }
    body[data-comp="phone"] #links .dot { display: none; }
    body[data-comp="phone"] #links a { display: flex; align-items: center; padding: 0; z-index: 10; }
    body[data-comp="phone"] #links a::after { bottom: var(--ub); background: #45586c; opacity: .38; transform: none; transition: opacity .3s ease, background .3s ease; }
    body[data-comp="phone"] #offer { position: absolute; left: calc(27px * var(--k)); top: calc(68px * var(--k)); --ub: calc(5px * var(--k)); height: calc(48px * var(--k)); font-size: calc(17px * var(--k)); line-height: calc(21px * var(--k)); }
    body[data-comp="phone"] #writing { position: fixed; right: calc(var(--stage-right) + 27px * var(--k)); bottom: max(44px, calc(env(safe-area-inset-bottom, 0px) + 12px)); --ub: calc(10px * var(--k)); height: calc(40px * var(--k)); font-size: calc(13px * var(--k)); line-height: calc(16px * var(--k)); transition-delay: .4s; }
    body[data-comp="phone"] #links a:hover, body[data-comp="phone"] #links a:focus-visible { color: #45586c; }
    body[data-comp="phone"] #links a:hover::after, body[data-comp="phone"] #links a:focus-visible::after { opacity: .38; background: #45586c; transform: none; }
    body[data-comp="phone"] #links a:active, body[data-comp="phone"] #links a:focus-visible { color: #262e38; }
    body[data-comp="phone"] #links a:active::after, body[data-comp="phone"] #links a:focus-visible::after { opacity: .9; background: #262e38; }
    @media (hover: hover) {
      body[data-comp="phone"] #links a:hover { color: #262e38; }
      body[data-comp="phone"] #links a:hover::after { opacity: .9; background: #262e38; }
    }
    @media (prefers-reduced-motion: reduce) {
      #links a, #links.show a, #stage, body.leaving #stage, body.leaving #links a { transition: none; }
    }
</style>

<script>// ---------------------------------------------------------------------------
// "Arrival" — Tanner Holman landing piece.
//   Layer 1 (WEBGL, p5.brush):  a landscape that emerges outward from the figure.
//   Layer 2 (2D canvas, multiply): the ensō — a pale sun over the far ridges.
//   Layer 3 (2D canvas):        the figure — a slate wash carrying the tone, then sparse
//                               form-following hatching and a broken brush contour.
//   Layer 4 (2D canvas, multiply): his handwritten name.
// One clock drives them all. Click to replay; the landscape re-draws itself on a loop.
// ---------------------------------------------------------------------------
(function () {
  const DATA = window.__ARRIVAL__;
  const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------------------------------------------------------------------------
  // Compositions. The same drawing on two sheets: the desktop artifact (1440×900) and the phone
  // artifact (900×1950, phone proportions at 2×). Every constant that differs between the two lives
  // here, in the order the drawing reads it; the drawing code itself is the desktop artifact's.
  // Portrait viewports (width / height < 0.8) run the phone sheet; everything else the desktop one.
  // ---------------------------------------------------------------------------
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const COMPS = {
    desktop: {
      kind: "desktop", W: 1440, H: 900,
      // choreography (seconds): the name lands first; figure strokes and landscape marks converge on DRAW;
      // then a beat of stillness, and the ensō goes down as the last gesture, finishing at END
      DRAW: 4.0, END: 6.4,
      TL: { washStart: 0.0, washDur: 1.2, figStart: 0.3, figDur: 4.0 - 0.3, nameStart: 0.45, nameDur: 1.75, ensoStart: 4.8, ensoDur: 1.6, ensoRest: 0.31, landStart: 0.05, landEnd: 4.0 },
      enso: { cx: 0.795, cy: 0.235, r: 0.14, rOf: "H" },
      fig: { hMax: 0.76, wMax: 0.5, cx: 0.64, bottom: 0.92 },
      name: (W, H, nameW) => { const nw = clamp(W * 0.22, 200, 340); return { s: nw / nameW, x: Math.max(W * 0.06, 28), y: Math.max(H * 0.075, 28) }; },
      horizon: 0.56, lakeBottom: 0.68,
      ridges: (PAL) => [
        { top: 0.22, amp: 0.28, freq: 0.0016, color: PAL.mist,  alpha: 190, shade: { col: PAL.fog,   brush: "2H", n: 90,  w: 0.8, depth: 0.5 } },
        { top: 0.31, amp: 0.22, freq: 0.0022, color: PAL.fog,   alpha: 150, shade: { col: PAL.slate, brush: "2H", n: 140, w: 0.8, depth: 0.55 } },
        { top: 0.40, amp: 0.14, freq: 0.0030, color: PAL.teal,  alpha: 100, shade: { col: PAL.slate, brush: "HB", n: 200, w: 0.9, depth: 0.7 } },
        { top: 0.48, amp: 0.07, freq: 0.0045, color: PAL.slate, alpha: 110, shade: { col: PAL.ink,   brush: "2B", n: 150, w: 0.9, depth: 0.8 } },
      ],
      ripples: { n: 34, len: [60, 420] }, tufts: 22,
      drifts: { n: 12, xMax: 0.6, len: [200, 700] }, skyFloor: 0.05, ceilingPad: 80,
      ambient: { reach: 600, rippleLen: [60, 300] },
      linksAt: (TL, DRAW) => DRAW,                              // the links come up as the drawing converges
    },
    phone: {
      kind: "phone", W: 900, H: 1950,                           // a tall sheet: phone proportions at 2×
      DRAW: 4.0, END: 7.8,                                      // the phone: the name is signed after the ensō
      TL: { washStart: 0.0, washDur: 1.2, figStart: 0.3, figDur: 4.0 - 0.3, nameStart: 6.3, nameDur: 1.4, ensoStart: 4.8, ensoDur: 1.6, ensoRest: 0.31, landStart: 0.05, landEnd: 4.0 },
      enso: { cx: 0.73, cy: 0.26, r: 0.135, rOf: "W" },
      fig: { hMax: 0.9, wMax: 0.80, cx: 0.54, bottom: 0.815 },
      name: (W, H, nameW) => { const nw = W * 0.56; return { s: nw / nameW, x: W * 0.07, y: H * 0.045 }; },
      horizon: 0.51, lakeBottom: 0.57,
      ridges: (PAL) => [
        { top: 0.335, amp: 0.081, freq: 0.0016, color: PAL.mist,  alpha: 190, shade: { col: PAL.fog,   brush: "2H", n: 70,  w: 0.8, depth: 0.5 } },
        { top: 0.360, amp: 0.064, freq: 0.0022, color: PAL.fog,   alpha: 150, shade: { col: PAL.slate, brush: "2H", n: 100, w: 0.8, depth: 0.55 } },
        { top: 0.385, amp: 0.041, freq: 0.0030, color: PAL.teal,  alpha: 100, shade: { col: PAL.slate, brush: "HB", n: 140, w: 0.9, depth: 0.7 } },
        { top: 0.410, amp: 0.021, freq: 0.0045, color: PAL.slate, alpha: 110, shade: { col: PAL.ink,   brush: "2B", n: 110, w: 0.9, depth: 0.8 } },
      ],
      ripples: { n: 18, len: [40, 260] }, tufts: 20,
      drifts: { n: 4, xMax: 0.5, len: [120, 360] }, skyFloor: 0.22, ceilingPad: 60,   // the sky under the name and links stays clear
      ambient: { reach: 400, rippleLen: [40, 220] },
      linksAt: (TL, DRAW) => TL.nameStart + TL.nameDur,         // the offer comes up as soon as the name is signed
    },
  };
  let C = COMPS.desktop, W = C.W, H = C.H, DRAW = C.DRAW, END = C.END, TL = C.TL;
  function applyComposition(kind) {
    C = COMPS[kind]; W = C.W; H = C.H; DRAW = C.DRAW; END = C.END; TL = C.TL;
    document.body.dataset.comp = kind;
    enso.cx = W * C.enso.cx; enso.cy = H * C.enso.cy; enso.r = (C.enso.rOf === "H" ? H : W) * C.enso.r;
  }
  const frame = document.getElementById("frame"), sheet = document.getElementById("sheet");
  function pickComposition() {
    const r = frame.getBoundingClientRect();
    return (r.width / Math.max(1, r.height) < 0.8) ? "phone" : "desktop";
  }
  // size the sheet to contain the current composition within the safe-area frame, centred, on whole
  // pixels; and publish its scale so the links (positioned in the design's own coordinate space) follow it
  function fitStage() {
    const r = frame.getBoundingClientRect();
    const s = Math.min(r.width / W, r.height / H);
    const sw = Math.max(1, Math.floor(W * s)), sh = Math.max(1, Math.floor(H * s));
    const left = Math.round(r.left + (r.width - sw) / 2), top = Math.round(r.top + (r.height - sh) / 2);
    sheet.style.width = sw + "px"; sheet.style.height = sh + "px"; sheet.style.left = left + "px"; sheet.style.top = top + "px";
    const rs = document.documentElement.style;
    rs.setProperty("--k", String(sw / (C.kind === "phone" ? 390 : 1440)));
    rs.setProperty("--stage-right", (window.innerWidth - (left + sw)) + "px");
  }

  // ---------------------------------------------------------------------------
  // Render scale. The sheet is always W×H in logical pixels (every constant below assumes it); each
  // canvas's backing store is W·R × H·R so that on dense screens the drawing is resolved rather than
  // magnified. R follows the screen: device pixels per logical pixel across the stage, capped at 2.
  //   R  — the 2D layers (figure, name, ensō, grass, ghost): vectors and images, cheap at any scale.
  //   RP — the p5/WEBGL landscape. p5 2.x sizes its canvas at ceil(devicePixelRatio) (a pixelDensity()
  //        call before createCanvas() is discarded), so the landscape has always been drawn at the
  //        screen's density; and p5.brush's pencil is made of sub-pixel dots that rasterise at a
  //        one-device-pixel floor, so its weight follows the density, not just its sharpness. RP
  //        therefore keeps to the screen's density (capped at 2) rather than the window's width —

  function drawUpTo(count) {

  // a few tufts of meadow in front of his shoes — so he stands in the grass, not on it
  let blades = [];
  function buildGrass() {
    P.randomSeed(23);

    for (let i = 0; i < 7; i++) spots.push([fig.x + fig.w * P.random(0.02, 0.34), feetY + P.random(-4, 10)]);

    for (let i = 0; i < 4; i++) spots.push([fig.x + fig.w * P.random(0.36, 0.7), feetY + P.random(2, 14)]);

  // ---------------------------------------------------------------------------
  // Handwriting

  let glyphs = [];

  // ---------------------------------------------------------------------------
  // Ensō — a pale sun over the far ridges: one fast gesture of a loaded brush. It lands

  // presses in again along the bottom, and lifts away in a dry hook. The circle leans,
  // bellies out on one side and never quite closes on itself. It sits behind him and in
  // front of the landscape (multiplied onto it), so the ridges rise into its lower edge.

  const easeInOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
  const easeOut = (u) => 1 - Math.pow(1 - u, 2.2);
  const countAt = (t) => REDUCED ? N : Math.floor(easeInOut(clamp((t - TL.figStart) / TL.figDur, 0, 1)) * N);
  const now = () => REDUCED ? 1e9 : ((P.millis() - t0) / 1000) * SETTINGS.tempo;
  const landNow = () => REDUCED ? 1e9 : ((P.millis() - landT0) / 1000) * SETTINGS.tempo;

  function composeFigure(t) {
    const ctx = figCtx;
    ctx.clearRect(0, 0, W, H);
    const wp = REDUCED ? 1 : smooth((t - TL.washStart) / TL.washDur);
    if (wp > 0) {
      ctx.save(); ctx.globalAlpha = wp;
      ctx.drawImage(matte, fig.x, fig.y, fig.w, fig.h);
      ctx.drawImage(washImg, fig.x, fig.y, fig.w, fig.h);
      ctx.restore();
      // the paddle's colour comes up a beat after the wash
      const rp = REDUCED ? 1 : smooth((t - TL.washStart - 0.5) / TL.washDur);
      if (rp > 0) { ctx.save(); ctx.globalAlpha = rp; ctx.drawImage(redImg, fig.x, fig.y, fig.w, fig.h); ctx.restore(); }
    }
    ctx.drawImage(buf, 0, 0, W, H);
    const gp = REDUCED ? 1 : smooth((t - (DRAW - 1.3)) / 1.0);
    if (gp > 0) { ctx.save(); ctx.globalAlpha = gp; ctx.drawImage(grassImg, 0, 0, W, H); ctx.restore(); }
  }

  // The loop is a dissolve, not a blackout: when the hold ends the finished landscape is copied onto a
  // ghost layer above the landscape canvas, the new washes go down underneath, and the ghost fades over
  // 2.6 s while the new marks begin — the old world melts into the new one and the paper never shows bare.
  const ghost = document.createElement("canvas");                       // sized for RP, the landscape's own scale
  ghost.setAttribute("aria-hidden", "true");
  ghost.style.cssText = "position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;z-index:0;";
  const ghostCtx = ghost.getContext("2d");
  function ghostTake() {
    const src = P.canvas || (P._renderer && P._renderer.canvas);
    ghostCtx.clearRect(0, 0, W, H);
    if (src) ghostCtx.drawImage(src, 0, 0, W, H);
    ghost.style.transition = "none"; ghost.style.opacity = "1";
  }
  function ghostRelease() {
    if (REDUCED) { ghost.style.opacity = "0"; return; }
    requestAnimationFrame(() => { ghost.style.transition = "opacity 2.6s ease-in-out"; ghost.style.opacity = "0"; });
  }

  function boot() {
    applyComposition(pickComposition());
    fitStage();
    new p5(function (p) {
      brush.instance(p);
      P = p;
      p.setup = function () {
        const c = p.createCanvas(W, H, p.WEBGL);
        c.parent("stage");
        c.elt.setAttribute("aria-hidden", "true");
        stage.appendChild(ghost);                         // above the landscape canvas, below everything else
        p.angleMode(p.DEGREES);
        brush.scaleBrushes(2.2);
        buildGlyphs();
        applyScale2D(screenScale());
        RP = landscapeScale(); sizeCanvas(ghost, RP);
        p.pixelDensity(RP);                               // after createCanvas: p5 2.x discards it before
        relayout();
        replay();
        if (REDUCED) showLinks();
        stage.addEventListener("click", onStageClick);
        window.addEventListener("keydown", (e) => {
          if (e.target && e.target.closest && e.target.closest("a, button, input")) return;
          if (e.key === "r" || e.key === "R" || e.key === " ") { e.preventDefault(); replay(); }
        });
        let resizeTimer = 0;
        const onViewport = () => { fitStage(); clearTimeout(resizeTimer); resizeTimer = setTimeout(onResize, 200); };
        window.addEventListener("resize", onViewport);
        window.addEventListener("orientationchange", onViewport);
      };
      p.draw = function () {
        if (land.drop) { land.drop = false; capP = R_FALLBACK; setScale(R, true); }
        p.translate(-W / 2, -H / 2);
        if (land.establish) {
          // lay every wash down in this single frame, then start the clock — no jump
          const te = performance.now();
          while (land.cursor < land.timeline.length && land.timeline[land.cursor].t <= 0.2) land.timeline[land.cursor++].fn();
          establishMs = performance.now() - te;
          land.establish = false;
          if (land.opening && land.resumeT == null && establishMs > ESTABLISH_BUDGET && RP > R_FALLBACK && OVERRIDE_R === null) {
            // too slow at this scale on this machine: next frame the landscape drops to 1.5 and lays its washes again
            land.drop = true;
            return;
          }
          if (land.resumeT != null) landT0 = p.millis() - land.resumeT * 1000 / SETTINGS.tempo;   // a re-laid landscape keeps its clock
          else { landT0 = p.millis(); if (land.opening) t0 = landT0; }
          if (land.ghosted) ghostRelease();                 // the old landscape dissolves over the new washes
        }
        const t = now(), lt = landNow();
        if (!linksShown && t >= C.linksAt(TL, DRAW)) showLinks();
        // figure + name layers
        const c = countAt(t);
        if (c > drawn) drawUpTo(c);
        if (!figDone) { composeFigure(t); drawName(t); if (t > END + 0.3) figDone = true; }
        // landscape layer
        stepLandscape(lt, p.millis());
        lastT = t;
      };
    });
  }

  function replay() {
    seed = Math.floor(Math.random() * 1e6);
    P.randomSeed(seed); P.noiseSeed(seed);
    drawn = 0; figDone = false;
    buildEnso();
    bufCtx.clearRect(0, 0, W, H);
    figCtx.clearRect(0, 0, W, H); nameCtx.clearRect(0, 0, W, H);
    t0 = landT0 = P.millis();
    ghost.style.transition = "none"; ghost.style.opacity = "0";
    land = { timeline: buildLandscape(true), cursor: 0, phase: "drawing", holdUntil: 0, fadeStart: 0, nextAmbient: 0, establish: true, opening: true, ghosted: false, resumeT: null };
    land.timeline.sort((a, b) => a.t - b.t);
    P.loop();
  }

  // the landscape alone re-draws itself; he and the sun stay
  function redrawLandscape() {
    seed = Math.floor(Math.random() * 1e6);
    P.randomSeed(seed); P.noiseSeed(seed);
    landT0 = P.millis();
    land = { timeline: buildLandscape(true), cursor: 0, phase: "drawing", holdUntil: 0, fadeStart: 0, nextAmbient: 0, establish: true, opening: false, ghosted: true, resumeT: null };
    land.timeline.sort((a, b) => a.t - b.t);
  }

  // ---------------------------------------------------------------------------
  // Scale changes (the window is resized, or the landscape proves slow at 2)
  // ---------------------------------------------------------------------------
  // (re)size every 2D layer for scale r and rebuild what depends on it: the ensō grain, the figure's
  // wash images, the grass raster, and the stroke buffer (redrawn to where it was). The name, figure
  // and ensō layers recompose to their current moment on the next frame.
  function applyScale2D(r) {
    R = r;
    for (const c of [figCanvas, nameCanvas, ensoCanvas, ensoBody, ensoHair]) sizeCanvas(c, R);
    ensoGrain = buildEnsoGrain(R);
    buildWashImages(R > 1 ? 2 : 1);
    if (buf) { buf = document.createElement("canvas"); bufCtx = sizeCanvas(buf, R); const d = drawn; drawn = 0; drawUpTo(d); }
    if (blades.length) rasterGrass();
    enso.drawn = 0; enso.landing = 0;
    figDone = false;
  }
  // lay the same landscape again on a re-sized sheet: same seed, same sequence, same marks — it keeps its
  // clock, so the marks already due go down as fast as the frame budget allows, and the old raster
  // (held on the ghost) dissolves over it
  function relayLandscape() {
    const L = land, resumeT = landNow();
    P.randomSeed(seed); P.noiseSeed(seed);
    if (L.opening) { buildEnso(); figDone = false; }     // the same randoms the opening drew; the ensō re-rasterises next frame
    land = { timeline: buildLandscape(true), cursor: 0, phase: "drawing", holdUntil: 0, fadeStart: 0, nextAmbient: 0, establish: true, opening: L.opening, ghosted: true, resumeT };
    land.timeline.sort((a, b) => a.t - b.t);
  }
  function setScale(r, restart) {
    const rp = landscapeScale();
    if (r !== R) applyScale2D(r);
    if (rp !== RP || restart) {
      sizeCanvas(ghost, rp);
      if (!restart) ghostTake();
      RP = rp;
      P.pixelDensity(RP); brush.load();
      if (restart) {                                       // the opening starts over, from the same seed
        P.randomSeed(seed); P.noiseSeed(seed); buildEnso();
        land = { timeline: buildLandscape(true), cursor: 0, phase: "drawing", holdUntil: 0, fadeStart: 0, nextAmbient: 0, establish: true, opening: true, ghosted: false, resumeT: null };
        land.timeline.sort((a, b) => a.t - b.t);
      } else relayLandscape();
      P.loop();
    } else if (land.phase === "idle") P.redraw(); else P.loop();
  }
  function onResize() {
    if (!P || !land.timeline.length) return;
    const kind = pickComposition();
    if (kind !== C.kind) { switchComposition(kind); return; }
    if (OVERRIDE_R !== null) return;
    const r = screenScale();
    if (Math.abs(r - R) >= 0.1 || landscapeScale() !== RP) setScale(r, false);
  }
  // the viewport has changed shape: the other sheet, re-sized and re-laid, drawn again from a fresh
  // seed — and brought straight to its finished state if the drawing had already finished
  function switchComposition(kind) {
    const wasFinished = finished();
    applyComposition(kind);
    fitStage();
    P.resizeCanvas(W, H);
    RP = landscapeScale(); P.pixelDensity(RP); brush.load();
    sizeCanvas(ghost, RP);
    applyScale2D(screenScale());
    relayout();
    replay();
    if (wasFinished) skip();
  }

  // ---------------------------------------------------------------------------
  // The page: click to skip or replay, the links, leaving
  // ---------------------------------------------------------------------------
  const finished = () => REDUCED || (P !== null && now() >= END);
  // bring the opening straight to its finished state: his clock and the landscape's are set back so that
  // every stroke and mark is due, and the landscape lays its remaining marks over the next few frames
  function skip() {
    if (REDUCED || !P) return;
    const ms = P.millis();
    t0 = ms - (END + 0.5) * 1000 / SETTINGS.tempo;
    if (land.opening) {
      if (land.establish) land.resumeT = TL.landEnd + 1;
      else landT0 = ms - (TL.landEnd + 1) * 1000 / SETTINGS.tempo;
      land.flush = true;
    }
    figDone = false;
    showLinks();
    P.loop();
  }
  function onStageClick() { if (!P) return; if (finished()) replay(); else skip(); }

  const links = document.getElementById("links");
  let linksShown = false;
  function showLinks() { linksShown = true; links.classList.add("show"); }
  // leaving: the page's own dissolve over the sheet (0.7 s) before navigating, so you leave on bare paper
  for (const a of links.querySelectorAll("a")) {
    a.addEventListener("click", (e) => {
      if (REDUCED || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (document.body.classList.contains("leaving")) { e.preventDefault(); return; }
      e.preventDefault();
      if (P) P.noLoop();                                       // the sheet holds still while it fades, so the timer is not starved by frames
      document.body.classList.add("leaving");
      setTimeout(() => { window.location.href = a.href; }, 700);
    });
  }
  window.addEventListener("pageshow", (e) => { if (e.persisted) { document.body.classList.remove("leaving"); if (P) P.loop(); } });

  function stepLandscape(t, nowMs) {
    const L = land, p = P;
    if (L.phase === "drawing") {
      const tt0 = performance.now();
      while (L.cursor < L.timeline.length && L.timeline[L.cursor].t <= t) {
        L.timeline[L.cursor++].fn();
        if (performance.now() - tt0 > (L.flush ? 120 : 30)) break;   // skipped ahead: catch up in a few long frames
      }
      setProgress(L.cursor / L.timeline.length);
      if (L.cursor >= L.timeline.length) { L.phase = "hold"; L.holdUntil = nowMs + SETTINGS.hold * 1000; L.nextAmbient = nowMs + 900; }
    } else if (L.phase === "hold") {
      if (!REDUCED && nowMs >= L.nextAmbient) { ambientMark(); L.nextAmbient = nowMs + p.random(700, 1600); }
      if (SETTINGS.loop && nowMs >= L.holdUntil) { L.phase = "fade"; L.fadeStart = nowMs; }
      else if (!SETTINGS.loop && figDone) { L.phase = "idle"; p.noLoop(); }
    } else if (L.phase === "fade") {
      // hold the finished landscape on the ghost layer, clear the sheet beneath it, and redraw: the dissolve runs on its own
      ghostTake();
      redrawLandscape();
    }
  }

  function setProgress(u) {}

  // ---------------------------------------------------------------------------
  // Landscape timeline (p5.brush)
  // ---------------------------------------------------------------------------
  function buildLandscape(withPaper) {
    const p = P, T = [];
    const random = (a, b) => (a === undefined ? p.random() : b === undefined ? p.random(a) : p.random(a, b));
    const noise = (x, y) => p.noise(x, y);
    const cos = (a) => Math.cos(a * Math.PI / 180), sin = (a) => Math.sin(a * Math.PI / 180);
    const horizon = H * C.horizon, lakeBottom = H * C.lakeBottom;
    const fcx = fig.x + fig.w / 2, fcy = fig.y + fig.h * 0.55;
    const feetX = fig.x + fig.w * 0.5, feetY = fig.y + fig.h - 6;
    const maxD = Math.hypot(W, H) * 0.62;
    const B = TL.landStart;
    // marks: ordered loosely by distance from him, but peppering in everywhere until the very end
    const when = (x, y, base, span) => base + span * clamp(0.45 * easeOut(Math.hypot(x - fcx, y - fcy) / maxD) + 0.55 * random(), 0, 1);

    T.push({ t: 0, fn: () => { if (withPaper) p.background(PAL.paper); brush.noField(); brush.noFill(); brush.noHatch(); brush.noMass(); brush.noWash(); } });

    // cast shadow under his feet, thrown away from the sun — laid after the meadow so it stays
    T.push({ t: B + 0.14, fn: () => {
      brush.noField(); brush.noStroke(); brush.noHatch();
      const sx = feetX - fig.w * 0.16, rx = fig.w * 0.62, ry = 13;
      for (const [k, al] of [[1.0, 42], [0.7, 46]]) {
        brush.wash(PAL.slate, al);
        const pts = [];
        for (let i = 0; i < 24; i++) { const a = (i / 24) * 360; pts.push([sx + cos(a) * rx * k * random(0.96, 1.04), feetY + 2 + sin(a) * ry * k * random(0.9, 1.1)]); }
        brush.polygon(pts);
      }
      brush.noWash();
    }});

    // big washes: meadow, lake, ridges (by distance)
    const bank = [];
    for (let x = -30; x <= W + 30; x += 40) bank.push([x, lakeBottom + noise(x * 0.004, 5) * 40 - 10]);
    bank.push([W + 30, H + 30], [-30, H + 30]);
    T.push({ t: B, fn: () => {
      brush.noField(); brush.noStroke(); brush.noHatch(); brush.noMass();
      brush.wash(PAL.sage, 55); brush.polygon(bank); brush.noWash();
    }});
    T.push({ t: B, fn: () => {
      brush.noField(); brush.noStroke(); brush.noHatch();
      brush.wash(PAL.mist, 110); brush.rect(-30, horizon, W + 60, lakeBottom - horizon + 12); brush.noWash();
    }});
    const ridges = C.ridges(PAL);
    const ridgeTops = [];
    ridges.forEach((r, i) => {
      const off = random(1000), top = [];
      for (let x = -30; x <= W + 30; x += 12) {
        const n = noise(x * r.freq + off, i * 7.3);
        const ridged = Math.pow(1 - Math.abs(2 * n - 1), 1.1);
        const detail = (noise(x * r.freq * 6 + off, 99) - 0.5) * 26;
        top.push([x, Math.min(H * r.top + (1 - ridged) * H * r.amp + detail, horizon + 8)]);
      }
      ridgeTops.push(top);
      const pts = top.concat([[W + 30, horizon + 10], [-30, horizon + 10]]);
      T.push({ t: B + 0.02 * (4 - i), fn: () => {
        brush.noField(); brush.noStroke(); brush.noHatch(); brush.noMass();
        brush.fillBleed(0.22, "out"); brush.fillTexture(0.5, 0.6);
        brush.fill(r.color, r.alpha);
        brush.polygon(pts);
      }});
    });
    // re-lay the lake and meadow over any ridge overflow
    T.push({ t: B + 0.12, fn: () => {
      brush.noField(); brush.noStroke(); brush.noHatch();
      brush.wash(PAL.paper, 190); brush.rect(-30, horizon, W + 60, lakeBottom - horizon + 12);
      brush.wash(PAL.mist, 110); brush.rect(-30, horizon, W + 60, lakeBottom - horizon + 12);
      brush.wash(PAL.paper, 210); brush.polygon(bank);
      brush.wash(PAL.sage, 55); brush.polygon(bank);
      brush.noWash();
    }});

    // marks radiate outward from him
    const B2 = B + 0.35, S2 = TL.landEnd - B2 - 0.15;
    ridges.forEach((r, i) => {
      const top = ridgeTops[i], sh = r.shade;
      for (let b = 0; b < sh.n; b += 12) {
        const [rx, ry] = top[Math.floor(random(2, top.length - 2))];
        T.push({ t: when(rx, ry, B2, S2), fn: () => {
          brush.wiggle(1.5); brush.noFill(); brush.noHatch(); brush.noMass();
          brush.set(sh.brush, sh.col, sh.w);
          for (let k = 0; k < 12; k++) {
            const idx = Math.floor(random(2, top.length - 2));
            const [x, y] = top[idx];
            if (y > horizon - 6) continue;
            const slope = (top[idx + 1][1] - top[idx - 1][1]) / (top[idx + 1][0] - top[idx - 1][0]);
            const steep = Math.min(Math.abs(slope), 1.2);
            if (random() > (0.25 + steep) * (slope > 0 ? 1 : 1.15)) continue;
            const lit = slope > 0;                                    // this flank faces the sun, top-right
            if (lit && random() > 0.35) continue;
            const ang = (slope > 0 ? 62 : 118) + random(-10, 10);
            const room = horizon - y;
            const sy = y + 3 + Math.pow(random(), 1.6) * room * sh.depth;
            const len = random(12, 30 + room * 0.18) * (lit ? 0.7 : 1);
            brush.strokeWeight(sh.w * random(0.7, 1.3) * (lit ? 0.85 : 1));
            brush.line(x, sy, x + cos(ang) * len, sy + sin(ang) * len);
          }
          brush.noField();
        }});
      }
      const step = 14;
      for (let s = 0; s < top.length - step; s += step) {
        const seg = top.slice(s, s + step + 1).filter((_, k) => k % 2 === 0);
        const [mx, my] = seg[Math.floor(seg.length / 2)];
        T.push({ t: when(mx, my, B2, S2, 0.3), fn: () => {
          brush.wiggle(2); brush.noFill(); brush.noHatch();
          brush.set(i < 2 ? "HB" : "2B", i < 2 ? PAL.fog : PAL.ink, i < 2 ? 0.9 : 1.1);
          brush.spline(seg, 0.15);
          brush.noField();
        }});
      }
    });
    for (let i = 0; i < C.ripples.n; i++) {
      const y = random(horizon + 6, lakeBottom - 6);
      const len = random(C.ripples.len[0], C.ripples.len[1]) * (0.6 + 0.6 * (y - horizon) / (lakeBottom - horizon));
      const x = random(-20, W - len);
      T.push({ t: when(x + len / 2, y, B2, S2), fn: () => {
        brush.wiggle(1); brush.noFill();
        brush.set(random() < 0.5 ? "marker" : "HB", random() < 0.6 ? PAL.teal : PAL.fog, random(0.5, 1.0));
        brush.line(x, y, x + len, y + random(-2, 2));
        brush.noField();
      }});
    }
    const wind = random(-14, 14);                                      // one weather for the whole meadow
    for (let i = 0; i < C.tufts; i++) {
      const cx = random(-10, W + 10), cy = random(lakeBottom + 14, H + 6);
      T.push({ t: when(cx, cy, B2, S2), fn: () => {
        brush.wiggle(3); brush.noFill(); brush.noHatch();
        const scale = 0.55 + 0.75 * (cy - lakeBottom) / (H - lakeBottom);
        const n = Math.floor(random(4, 9));
        for (let k = 0; k < n; k++) {
          const x = cx + random(-16, 16) * scale, y = cy + random(-4, 4);
          const h = random(18, 48) * scale, lean = (wind + random(-7, 7)) * scale;
          brush.set(random() < 0.6 ? "HB" : "cpencil", random() < 0.5 ? PAL.slate : PAL.sage, random(0.7, 1.15));
          brush.spline([[x, y, 1.2], [x + lean * 0.35, y - h * 0.6, 0.9], [x + lean, y - h, 0.4]], 0.6);
        }
        brush.noField();
      }});
    }
    // sky: a few long drifts of cloud, kept clear of the sun and above the far ridge
    ridge0 = ridgeTops[0];
    for (let i = 0; i < C.drifts.n; i++) {
      const x = random(-40, W * C.drifts.xMax), len = random(C.drifts.len[0], C.drifts.len[1]);
      const ceiling = ridgeCeiling(x, x + len);
      if (ceiling < H * C.skyFloor + 30) continue;
      const y = random(H * C.skyFloor, ceiling);
      T.push({ t: when(x + len / 2, y, B2, S2), fn: () => {
        brush.field("waves"); brush.noFill(); brush.noHatch();
        const room = (y < enso.cy + enso.r * 1.1) ? enso.cx - enso.r * 1.15 - x : len;
        if (room < 60) { brush.noField(); return; }
        brush.set("2H", random() < 0.35 ? PAL.fog : PAL.mist, random(0.8, 1.6));
        brush.flowLine(x, y, Math.min(len, room), random(-4, 4));
        brush.noField();
      }});
    }

    return T;
  }

  // the lowest a sky drift may run over a stretch of the far ridge (with room for the waves field to wander)
  function ridgeCeiling(x0, x1) {
    if (!ridge0) return H * C.horizon - C.ceilingPad;
    let lo = Infinity;
    for (const [x, y] of ridge0) if (x >= x0 - 30 && x <= x1 + 30 && y < lo) lo = y;
    return Math.min(H * C.horizon - C.ceilingPad, lo - 40);
  }

  function ambientMark() {
    const p = P;
    const horizon = H * C.horizon, lakeBottom = H * C.lakeBottom;
    brush.noFill(); brush.noHatch(); brush.noMass(); brush.noWash();
    if (p.random() < 0.5) {
      brush.field("waves");
      brush.set("2H", PAL.mist, p.random(0.8, 1.3));
      const x = p.random(-40, W * 0.5), ceiling = ridgeCeiling(x, x + C.ambient.reach);
      if (ceiling < H * C.skyFloor + 30) { brush.noField(); return; }
      const y = p.random(H * C.skyFloor, ceiling);
      const room = (y < enso.cy + enso.r * 1.1) ? enso.cx - enso.r * 1.15 - x : 600;
      if (room >= 60) brush.flowLine(x, y, Math.min(p.random(200, 600), room), p.random(-4, 4));
    } else {
      brush.wiggle(1);
      const y = p.random(horizon + 6, lakeBottom - 6), len = p.random(C.ambient.rippleLen[0], C.ambient.rippleLen[1]), x = p.random(-20, W - len);
      brush.set("HB", PAL.fog, p.random(0.5, 0.9));
      brush.line(x, y, x + len, y + p.random(-2, 2));
    }
    brush.noField();
  }

  window.__arrival = { replay, skip, SETTINGS, get comp() { return C.kind; }, get finished() { return finished(); }, get land() { return land; }, get t() { return P ? now() : 0; }, get frameT() { return lastT; },
    get R() { return R; }, get RP() { return RP; }, get establishMs() { return establishMs; },
    setScale: (r) => { OVERRIDE_R = r == null ? null : Math.min(R_MAX, Math.max(1, r)); setScale(screenScale(), false); } };
})();
</script>
</body>
</html>
