<script>
// The landing animation: the finished print is there from the first frame, all but the cartwheel; then the cartwheel
// happens, and the clouds drift a few pixels over a long cycle. Built from the layers mock/anim.py renders, stacked
// in the page: nothing is drawn live but the ink of an impression as it takes.
//
// Two versions:
//   'motion'       the body moves. It runs through every frame of the clip from the reach to the straddle (a
//                  flipbook, with a short trail like a long exposure), and each of the three key poses it passes
//                  stays behind as a ghost. It lands in the straddle, where the full-colour print takes over the
//                  silhouette and the contact shadow comes up with the weight. Needs anim.py --movers.
//   'impressions'  the first prototype: the ghosts print in place one after another, then the straddle.
//
//   const p = PrintPlayer.mount(host, manifest, { dir, mode, reveal: 'ink' | 'fade', text: 'arrows' | 'wash' | null,
//                                                 reduced, finished, driftSpeed, slow, trail, onShow, onReady, autoplay })
// The land and clouds show as soon as they have loaded (onShow); the cartwheel starts once everything has (onReady).
// `finished` (or `reduced`) opens on the finished print: no cartwheel, and the drift only if not reduced.
//   p.replay(); p.setText(style); p.setDriftSpeed(k); p.destroy();
//
// `host` is sized by the caller to the sheet's aspect ratio; everything inside is positioned in % of the sheet.
window.PrintPlayer = (function () {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
  const easeOut = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 2.4);

  // 'impressions': the four poses are clip frames 12, 25, 34 and 45 (30 fps), played 2.6 times slower. Each ghost
  // takes 0.8 s to print, the straddle 0.85 s; its shadow comes up just after it. Done by about 4.5 s.
  const TIMING = { lead: 0.6, slow: 2.6, frames: [12, 25, 34, 45], ghost: 0.8, hero: 0.85, shadowLag: 0.22, shadow: 0.9 };
  // 'motion': the clip's frames 8–45 at `slow` times real time (1.7: a frame every 57 ms, the whole cartwheel in
  // 2.1 s). The body inks in over its first four frames; each earlier frame lingers at `trail` of full strength and
  // fades with a time constant of `trailFade` s. A key pose becomes its ghost as the body leaves it (`ghostFade` s).
  // On the straddle the colour print takes over (`hero` s), the shadow comes up, and the silhouette under the
  // print fades away.
  const MOTION = { lead: 0.7, slow: 1.7, first: 8, last: 45, rampIn: 4, keys: [12, 25, 34], trail: 0.5, trailFade: 0.075,
    ghostFade: 0.4, heroLag: 0.03, hero: 0.65, shadowLag: 0.14, shadow: 0.6, bodyOut: 0.5, bodyOutDur: 0.35 };
  // After it lands the clouds drift: screen px each way at the design's size and seconds per crossing, eased at
  // both ends so each starts from rest. Different lengths keep them from moving in step.
  const DRIFT = [{ amp: 6, period: 47 }, { amp: -5, period: 61 }, { amp: 4, period: 39 }];

  let uid = 0;
  function mount(host, man, opt = {}) {
    const id = 'pp' + (++uid), dir = opt.dir || '';
    const W = man.W, H = man.H, SS = man.ss || 1;
    const mode = opt.mode === 'motion' && man.movers ? 'motion' : 'impressions';
    const reveal = opt.reveal || 'ink', reduced = !!opt.reduced;
    const M = Object.assign({}, MOTION, opt.slow ? { slow: opt.slow } : {}), T = Object.assign({}, TIMING, opt.timing || {});
    let trailOn = opt.trail !== false;
    let driftSpeed = opt.driftSpeed || 1, textStyle = opt.text === undefined ? 'arrows' : opt.text;

    // ---- the tracks: for each layer, what it shows at time t ----
    const tf = (f) => M.lead + (f - M.first) * M.slow / 30;           // when the body reaches clip frame f
    const t45 = tf(M.last);
    let tracks, end;
    if (mode === 'motion') {
      tracks = [
        ...['g1', 'g2', 'g3'].map((id, k) => ({ id, kind: 'fade', at: tf(M.keys[k] + 1), dur: M.ghostFade })),
        { id: 'hero', kind: reveal, at: t45 + M.heroLag, dur: M.hero, sweep: [0, -1] },
        { id: 'shadow', kind: 'fade', at: t45 + M.shadowLag, dur: M.shadow },
      ];
      end = Math.max(t45 + M.bodyOut + M.bodyOutDur, ...tracks.map((e) => e.at + e.dur));
    } else {
      const at = T.frames.map((f) => T.lead + (f - T.frames[0]) / 30 * T.slow);
      tracks = [
        { id: 'g1', kind: reveal, at: at[0], dur: T.ghost, sweep: [1, 0] },
        { id: 'g2', kind: reveal, at: at[1], dur: T.ghost, sweep: [1, 0] },
        { id: 'g3', kind: reveal, at: at[2], dur: T.ghost, sweep: [1, 0] },
        { id: 'hero', kind: reveal, at: at[3], dur: T.hero, sweep: [0, -1] },          // hands first, the legs last
        { id: 'shadow', kind: reveal, at: at[3] + T.shadowLag, dur: T.shadow, sweep: [0, 0] },
      ];
      end = Math.max(...tracks.map((e) => e.at + e.dur));
    }
    const ramp = (f) => f < M.first + M.rampIn ? (f - M.first + 1) / (M.rampIn + 1) : 1;
    function bodyOpacity(f, t) {
      if (t < M.lead) return 0;
      const cur = Math.min(M.last, M.first + Math.floor((t - M.lead) * 30 / M.slow));
      if (f > cur) return 0;
      if (f === cur) return f === M.last ? ramp(f) * (1 - smooth((t - t45 - M.bodyOut) / M.bodyOutDur)) : ramp(f);
      if (!trailOn) return 0;
      const o = ramp(f) * M.trail * Math.exp(-(t - tf(f + 1)) / M.trailFade);
      return o < 0.02 ? 0 : o;
    }

    // ---- the stack ----
    const sheet = document.createElement('div');
    sheet.className = 'pp-sheet'; sheet.id = id;
    sheet.style.cssText = 'position:absolute;inset:0;overflow:hidden;contain:strict;';
    const style = document.createElement('style');
    host.appendChild(sheet); sheet.appendChild(style);
    const place = (el, L) => { el.style.cssText = `position:absolute;left:${L.x / (W * SS) * 100}%;top:${L.y / (H * SS) * 100}%;width:${L.w / (W * SS) * 100}%;height:${L.h / (H * SS) * 100}%;display:block;`; return el; };
    const img = (L) => { const im = new Image(); im.decoding = 'async'; im.alt = ''; im.draggable = false; im.src = dir + L.src; return im; };

    const base = place(img(man.base), man.base);
    const clouds = man.clouds.map((L, k) => { const wrap = place(document.createElement('div'), L); const im = img(L); im.style.cssText = 'width:100%;height:100%;display:block;'; wrap.appendChild(im); wrap.dataset.k = k; return { L, wrap, im }; });
    const patches = {};
    for (const e of tracks) patches[e.id] = { e, L: man[e.id], im: img(man[e.id]), el: null, p: -1, ink: null };
    const bodies = mode === 'motion' ? man.movers.map((L) => ({ f: L.f, L, im: img(L), o: -1 })) : [];
    const texts = {};
    if (textStyle) for (const s in (man.text || {})) texts[s] = place(img(man.text[s]), man.text[s]);
    const mountPatch = (P) => {
      if (P.e.kind === 'ink') { P.el = place(document.createElement('canvas'), P.L); P.el.width = P.L.w; P.el.height = P.L.h; }
      else { P.el = place(P.im, P.L); P.el.style.opacity = '0'; }
      sheet.appendChild(P.el);
    };
    sheet.append(base, ...clouds.map((c) => c.wrap));
    // ghosts under the moving body; the straddle and its shadow over it
    for (const k of ['g1', 'g2', 'g3']) mountPatch(patches[k]);
    for (const B of bodies) { place(B.im, B.L); B.im.style.opacity = '0'; sheet.appendChild(B.im); }
    for (const k of ['hero', 'shadow']) mountPatch(patches[k]);
    for (const s in texts) { texts[s].style.visibility = s === textStyle ? 'visible' : 'hidden'; sheet.appendChild(texts[s]); }
    sheet.style.visibility = 'hidden';
    const late = [...Object.values(patches).map((P) => P.el), ...bodies.map((B) => B.im)];
    for (const el of late) el.style.visibility = 'hidden';            // until everything has loaded

    // the drift, as CSS animations (they run off the main thread and cost nothing once set)
    function driftCSS(on) {
      style.textContent = on ? clouds.map((c, k) => {
        // amplitudes are screen pixels at the design's own size: the phone sheet shows at about 390/900 of its pixels
        const D = DRIFT[k % DRIFT.length], pct = D.amp * (man.kind === 'phone' ? 2.3 : 1) * SS / c.L.w * 100;
        return `@keyframes ${id}d${k}{from{transform:translate3d(0,0,0)}to{transform:translate3d(${pct.toFixed(3)}%,0,0)}}` +
          `#${id}>div[data-k="${k}"]{animation:${id}d${k} ${(D.period / driftSpeed).toFixed(2)}s ease-in-out infinite alternate;will-change:transform}`;
      }).join('\n') : '';
    }

    // ink: an impression takes the way a baren rub prints, blotchy first and then filling in. A threshold map per
    // layer (broad mottle, fine grain and a slight sweep), equalised so the printed area grows evenly with time;
    // each frame the layer's alpha is its own where the map is below the progress, with a soft edge.
    function prepInk(P) {
      const w = P.L.w, h = P.L.h, c = document.createElement('canvas'); c.width = w; c.height = h;
      const cx = c.getContext('2d', { willReadFrequently: true }); cx.drawImage(P.im, 0, 0);
      const src = cx.getImageData(0, 0, w, h);
      const A = new Uint8Array(w * h), idx = [];
      for (let i = 0; i < w * h; i++) { A[i] = src.data[i * 4 + 3]; if (A[i]) idx.push(i); }
      const noise = (cell, seed) => {
        const gw = Math.ceil(w / cell) + 3, gh = Math.ceil(h / cell) + 3, g = document.createElement('canvas'); g.width = gw; g.height = gh;
        const gx = g.getContext('2d'), gd = gx.createImageData(gw, gh); let s = seed * 9301 + 49297;
        for (let i = 0; i < gw * gh; i++) { s = (s * 1103515245 + 12345) >>> 0; const v = (s >>> 16) & 255; gd.data[i * 4] = gd.data[i * 4 + 1] = gd.data[i * 4 + 2] = v; gd.data[i * 4 + 3] = 255; }
        gx.putImageData(gd, 0, 0);
        const u = document.createElement('canvas'); u.width = w; u.height = h; const ux = u.getContext('2d', { willReadFrequently: true });
        ux.imageSmoothingEnabled = true; ux.imageSmoothingQuality = 'high'; ux.filter = `blur(${(cell * 0.3).toFixed(1)}px)`;
        ux.drawImage(g, -cell, -cell, gw * cell, gh * cell); ux.filter = 'none';
        const d = ux.getImageData(0, 0, w, h).data, out = new Float32Array(w * h);
        for (let i = 0; i < w * h; i++) out[i] = d[i * 4] / 255;
        return out;
      };
      const seed = P.L.x * 7 + P.L.y;
      const m = noise(Math.max(4, Math.round(24 * SS)), seed), f = noise(Math.max(2, Math.round(6 * SS)), seed + 1);
      const [sx, sy] = P.e.sweep || [0, 0], TM = new Float32Array(w * h);
      for (const i of idx) {
        const x = i % w, y = (i / w) | 0;
        const sw = sx || sy ? ((sx > 0 ? x / w : sx < 0 ? 1 - x / w : 0) + (sy > 0 ? y / h : sy < 0 ? 1 - y / h : 0)) : 0.5;
        TM[i] = 0.5 * m[i] + 0.18 * f[i] + 0.4 * sw;
      }
      const bins = new Uint32Array(1024); let lo = 1e9, hi = -1e9;
      for (const i of idx) { if (TM[i] < lo) lo = TM[i]; if (TM[i] > hi) hi = TM[i]; }
      const k = 1023 / (hi - lo || 1);
      for (const i of idx) bins[(TM[i] - lo) * k | 0]++;
      const cdf = new Float32Array(1024); let acc = 0; for (let b = 0; b < 1024; b++) { acc += bins[b]; cdf[b] = acc / idx.length; }
      for (const i of idx) TM[i] = cdf[(TM[i] - lo) * k | 0];
      const out = cx.createImageData(w, h); out.data.set(src.data);
      for (const i of idx) out.data[i * 4 + 3] = 0;
      P.ink = { A, T: TM, idx: Int32Array.from(idx), out, ctx: P.el.getContext('2d') };
    }
    const SOFT = 0.28;
    function drawInk(P, p) {
      const I = P.ink, d = I.out.data, A = I.A, TM = I.T, q = p * (1 + SOFT), inv = 1 / SOFT;
      if (p >= 1) { for (const i of I.idx) d[i * 4 + 3] = A[i]; }
      else for (let n = 0; n < I.idx.length; n++) { const i = I.idx[n]; let t = (q - TM[i]) * inv; t = t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t); d[i * 4 + 3] = A[i] * t; }
      I.ctx.putImageData(I.out, 0, 0);
    }
    function setPatch(P, u) {
      const p = P.e.kind === 'ink' ? smooth(u) : easeOut(u);
      if (p === P.p) return;
      P.p = p;
      if (P.e.kind === 'ink') drawInk(P, p); else P.el.style.opacity = String(p);
    }
    function setBody(B, o) { if (o !== B.o) { B.o = o; B.im.style.opacity = o.toFixed(3); } }

    let t0 = 0, raf = 0, ready = false, dead = false, drifting = false;
    function frame(now) {
      raf = 0; if (dead) return;
      const t = (now - t0) / 1000;
      for (const k in patches) { const P = patches[k]; setPatch(P, clamp((t - P.e.at) / P.e.dur, 0, 1)); }
      for (const B of bodies) setBody(B, bodyOpacity(B.f, t));
      if (!drifting && t >= end) { drifting = true; driftCSS(!reduced); }
      if (t < end + 0.05) raf = requestAnimationFrame(frame);
    }
    function start(done = reduced || !!opt.finished) {
      if (dead) return;
      drifting = false; driftCSS(false);
      for (const k in patches) { const P = patches[k]; P.p = -1; setPatch(P, done ? 1 : 0); }
      for (const B of bodies) { B.o = -1; setBody(B, 0); }
      if (done) { drifting = true; driftCSS(!reduced); return; }
      // measure from the next frame, so the body starts after the land has been on screen for `lead`
      requestAnimationFrame((now) => { t0 = now; if (!raf) raf = requestAnimationFrame(frame); });
    }

    const settle = (im) => im.decode().catch(() => new Promise((r) => { if (im.complete) r(); else { im.onload = im.onerror = r; } }));
    const first = [base, ...clouds.map((c) => c.im), ...Object.values(texts)];
    const rest = [...Object.values(patches).map((P) => P.im), ...bodies.map((B) => B.im)];
    const shown = Promise.all(first.map(settle)).then(() => { if (dead) return; sheet.style.visibility = 'visible'; if (opt.onShow) opt.onShow(); });
    Promise.all([shown, ...rest.map(settle)]).then(() => {
      if (dead) return;
      for (const k in patches) if (patches[k].e.kind === 'ink') { const P = patches[k]; try { prepInk(P); } catch (e) { P.e.kind = 'fade'; P.el.getContext('2d').drawImage(P.im, 0, 0); P.el.style.opacity = '0'; } }
      for (const el of late) el.style.visibility = '';
      ready = true;
      if (opt.onReady) opt.onReady();
      if (opt.autoplay !== false) start();
    });

    return {
      get ready() { return ready; },
      end, mode,
      replay() { if (!ready) return; if (raf) { cancelAnimationFrame(raf); raf = 0; } start(); },
      start() { if (ready) start(); },
      setText(s) { textStyle = s; for (const k in texts) texts[k].style.visibility = k === s ? 'visible' : 'hidden'; },
      setDriftSpeed(k) { driftSpeed = k; if (drifting) driftCSS(!reduced); },
      setTrail(on) { trailOn = on; },
      destroy() { dead = true; if (raf) cancelAnimationFrame(raf); sheet.remove(); },
    };
  }
  return { mount, TIMING, MOTION, DRIFT };
})();

</script>
<script>
// ---------------------------------------------------------------------------
// The landing: the print is on screen from the first moment, all but the cartwheel; the body then cartwheels
// across the plain, leaving its three ghosts behind, and lands in the straddle; then the clouds drift. Clicking
// the drawing does nothing. With reduced motion the finished print shows, still.
// ---------------------------------------------------------------------------
(function () {
  var P = window.PRINT, REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage'), sheet = document.getElementById('sheet'), host = document.getElementById('print');
  var links = document.getElementById('links'), dot = links.querySelector('.dot'), offer = document.getElementById('offer'), writing = document.getElementById('writing');
  var comp = null, set = null, player = null, played = false;
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  // Which part of the sheet the screen shows. Phone: its full width, from the top; a shorter screen loses ground
  // at the bottom. Desktop: as much as fills the screen, keeping the name, links, sun and cartwheel (C.safe) in
  // view; a screen too wide or too narrow for that shows paper beside or above the print.
  function view() {
    var C = P.comps[comp], vw = stage.clientWidth, vh = stage.clientHeight, A = vw / Math.max(1, vh), u, x0, y0;
    if (comp === 'phone') { u = vw / C.W; x0 = 0; y0 = 0; }
    else {
      var s = C.safe, w = Math.min(C.W, C.H * A), h = w / A;
      if (w < s[2] - s[0]) { w = s[2] - s[0]; h = w / A; }
      if (h < s[3] - s[1]) { h = s[3] - s[1]; w = h * A; }
      u = vw / w;
      x0 = w >= C.W ? (C.W - w) / 2 : clamp((s[0] + s[2]) / 2 - w / 2, 0, C.W - w);
      y0 = h >= C.H ? (C.H - h) / 2 : clamp((s[1] + s[3]) / 2 - h / 2, 0, C.H - h);
    }
    return { u: u, x0: x0, y0: y0 };
  }
  function pickSet(u) {
    var C = P.comps[comp], need = u * (window.devicePixelRatio || 1);
    for (var i = 0; i < C.sets.length; i++) if (P.sets[C.sets[i]].ss >= need * 0.85) return C.sets[i];
    return C.sets[C.sets.length - 1];
  }
  function layout() {
    var C = P.comps[comp], v = view();
    sheet.style.width = C.W + 'px'; sheet.style.height = C.H + 'px';
    sheet.style.transform = 'translate(' + (-v.x0 * v.u) + 'px,' + (-v.y0 * v.u) + 'px) scale(' + v.u + ')';
    document.documentElement.style.setProperty('--u', '1px');
    // the links are in sheet px too; the desktop's second link sits after the first, measured once the font is in
    if (comp === 'desktop') placeDesktopLinks();
    return v;
  }
  function placeDesktopLinks() {
    var w = offer.getBoundingClientRect().width / (sheet.getBoundingClientRect().width / P.comps.desktop.W || 1);
    links.style.setProperty('--dot-x', (88 + w + 18) + 'px'); links.style.setProperty('--writing-x', (88 + w + 18 + 3.2 + 18) + 'px');
  }
  // The land shows as soon as it has loaded; the cartwheel starts once its own layers have. If they take more than
  // five seconds longer (a slow connection), the page opens on the finished print instead of starting it late.
  var LATE = 5000;
  function mount(finished) {
    if (player) { player.destroy(); player = null; }
    var S = P.sets[set], shownAt = 0;
    host.style.backgroundImage = 'url(' + P.comps[comp].lqip + ')';
    var p = player = PrintPlayer.mount(host, S, { dir: '/print/' + set + '/', mode: 'motion', reveal: 'ink', slow: P.slow, trail: true, text: null,
      reduced: REDUCED, finished: finished, autoplay: false,
      onShow: function () { shownAt = performance.now(); },
      onReady: function () {
        if (p !== player) return;
        var late = !finished && shownAt && performance.now() - shownAt > LATE;
        played = true; window.__printReady = true;
        if (late) { player.destroy(); player = PrintPlayer.mount(host, S, { dir: '/print/' + set + '/', mode: 'motion', text: null, reduced: REDUCED, finished: true }); }
        else p.start();
      } });
  }
  function choose() {
    var c = window.innerWidth / Math.max(1, window.innerHeight) < 0.8 ? 'phone' : 'desktop';
    var changed = c !== comp; comp = c; document.body.dataset.comp = comp;
    var v = layout(), s = pickSet(v.u);
    if (changed || (P.sets[s].ss > P.sets[set].ss)) { set = s; mount(played); }       // never replays: a rotation opens on the finished print
  }
  comp = P.first.comp; set = P.first.set; document.body.dataset.comp = comp;
  layout(); mount(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (comp === 'desktop') placeDesktopLinks(); });
  var rt = 0;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(choose, 120); });
  window.addEventListener('orientationchange', function () { setTimeout(choose, 200); });

  // leaving: the page's own dissolve over the sheet (0.7 s) before navigating, so you leave on bare paper
  Array.prototype.forEach.call(links.querySelectorAll('a'), function (a) {
    a.addEventListener('click', function (e) {
      if (REDUCED || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (document.body.classList.contains('leaving')) { e.preventDefault(); return; }
      e.preventDefault();
      document.body.classList.add('leaving');
      setTimeout(function () { window.location.href = a.href; }, 700);
    });
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) document.body.classList.remove('leaving'); });
})();
</script>
<script>
(function(){
  // Count clicks on the two links; no-op if count.js is blocked or hasn't loaded.
  // The page's 0.7 s dissolve before navigating gives the beacon time to send.
  var links = document.getElementById("links");
  if (!links) return;
  links.addEventListener("click", function(e){
    var a = e.target && e.target.closest ? e.target.closest("a") : null;
    if (!a || !(window.goatcounter && window.goatcounter.count)) return;
    window.goatcounter.count({ path: "click-" + a.id, title: a.textContent.trim(), event: true });
  }, true);
})();
</script>
<script data-goatcounter="https://tannerholman.goatcounter.com/count"
